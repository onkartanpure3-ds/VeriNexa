services:
  - type: web
    name: verinexa-backend
    runtime: python
    rootDir: backend
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: NEWSAPI_KEY
        sync: false
      - key: NEWSAPI_URL
        value: https://newsapi.org/v2/everything
      - key: GDELT_URL
        value: https://api.gdeltproject.org/api/v2/doc/doc
      - key: GDELT_ENABLED
        value: "true"
      - key: GOOGLE_NEWS_ENABLED
        value: "true"
      - key: MPNET_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: NLI_MODEL
        value: cross-encoder/nli-deberta-v3-xsmall
      - key: LIGHTWEIGHT_MODE
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
